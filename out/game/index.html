<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PORT VESPER - Open-World Crime Sandbox</title>
<meta name="description" content="A self-contained top-down open-world crime game. Walk, drive, shoot, take jobs and outrun the police in Port Vesper.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  noscript { position: absolute; inset: 0; display: grid; place-items: center; color: #f5c65f; font: 16px sans-serif; }
</style>
</head>
<body>
<canvas id="game" aria-label="Port Vesper: a top-down open-world crime game. Use WASD to walk and drive, Space to enter or exit cars, Shift to sprint, mouse to aim and click to shoot, and E to start missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript>Port Vesper needs JavaScript enabled.</noscript>
<script type="module" src="./src/game.js"></script>
</body>
</html>
